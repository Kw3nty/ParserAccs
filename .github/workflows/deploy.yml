name: Deploy Cloudflare Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: parseraccs-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: BUILD_VERSION="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" npm run build
      - name: Deploy
        run: npx wrangler pages deploy ./dist --project-name=parseraccs --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Manual Facebook OG refresh instructions
        run: |
          echo "### Manual Facebook OG refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "Open each URL in Sharing Debugger and click Scrape Again:" >> "$GITHUB_STEP_SUMMARY"
          node -e 'const p=require("./dist/parseraccs/latest/package-info.json"); for(const u of p.manualScrapeUrls) console.log(`- ${u}`)' >> "$GITHUB_STEP_SUMMARY"
