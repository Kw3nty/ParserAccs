name: pack-og

on:
  push:
    branches: [ main ]
    paths:
      - 'parseraccs.js'
      - 'tools/**'
      - '.github/workflows/pack.yml'

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pack OG
        run: node tools/packager.js
      - name: Commit og/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og
          if git diff --cached --quiet; then
            echo "og: no changes"
          else
            git commit -m "chore: pack og [skip ci]"
            git push
          fi
