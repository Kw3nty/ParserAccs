<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParserAccs — Facebook Ads parser bookmarklet</title>
<meta name="description" content="Bookmarklet for bulk parsing of Facebook Ads Manager accounts and cross-account automated-rules transfer: balance, spend by period, limits, billing, ad status, BM mapping, CSV export and AutoRules with currency conversion.">
<meta name="theme-color" content="#0b0d11">
<style>
  :root{
    --bg0:#0b0d11; --bg1:#141519; --bg2:#1a1c21; --line:#23262e;
    --txt:#e8eaef; --mut:#9aa0ab; --teal:#2dd4bf; --blue:#3b8cff;
    --violet:#a78bfa; --amber:#f5b13d; --green:#37d67a; --red:#ff5d6c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'SF Pro Text','Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg0); color:var(--txt); line-height:1.6;
    overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }
  #bg-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 22px}
  [data-i18n],[data-i18n-html]{transition:opacity .25s ease}
  .i18n-fade{opacity:0}

  header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:20px 0}
  .logo{font-family:'Space Grotesk','SF Pro Display',system-ui,sans-serif;font-weight:800;font-size:18px;letter-spacing:.4px;
    background:linear-gradient(92deg,#fff,#2dd4bf 60%,#3b8cff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .h-right{display:flex;align-items:center;gap:12px}
  .gh{display:inline-flex;align-items:center;gap:7px;color:var(--mut);text-decoration:none;font-size:13px;font-weight:600;
    border:1px solid var(--line);border-radius:20px;padding:7px 14px;transition:.18s}
  .gh:hover{color:var(--teal);border-color:var(--teal);transform:translateY(-1px)}

  .langsw{position:relative;display:inline-flex;align-items:center;background:var(--bg2);border:1px solid var(--line);
    border-radius:20px;padding:3px;cursor:pointer;user-select:none;font-family:ui-monospace,monospace}
  .langsw .opt{position:relative;z-index:2;font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--mut);
    padding:5px 12px;border-radius:16px;transition:color .2s}
  .langsw .opt.on{color:#06120f}
  .langsw .knob{position:absolute;z-index:1;top:3px;left:3px;height:calc(100% - 6px);width:calc(50% - 3px);
    border-radius:16px;background:linear-gradient(135deg,#2dd4bf,#3b8cff);box-shadow:0 2px 10px rgba(45,212,191,.35);
    transition:transform .26s cubic-bezier(.34,1.4,.5,1)}
  .langsw.en .knob{transform:translateX(100%)}

  .hero{text-align:center;padding:46px 0 30px}
  .hero h1{font-family:'Space Grotesk','SF Pro Display',system-ui,sans-serif;font-weight:800;letter-spacing:.5px;
    font-size:clamp(38px,7vw,72px);line-height:1.02;
    background:linear-gradient(92deg,#ffffff 0%,#2dd4bf 42%,#3b8cff 70%,#ffffff 100%);background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:tshift 7s linear infinite,tglow 3.6s ease-in-out infinite}
  @keyframes tshift{0%{background-position:0% 50%}100%{background-position:220% 50%}}
  @keyframes tglow{0%,100%{filter:drop-shadow(0 0 0 rgba(45,212,191,0))}50%{filter:drop-shadow(0 0 26px rgba(45,212,191,.35))}}
  .hero p.lead{max-width:680px;margin:18px auto 0;color:var(--mut);font-size:clamp(15px,2.2vw,18px)}
  .tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}
  .tag{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--teal);background:rgba(45,212,191,.1);
    border:1px solid rgba(45,212,191,.3);border-radius:20px;padding:5px 12px}

  .install{margin:38px auto 0;max-width:760px;text-align:center;
    background:linear-gradient(180deg,rgba(26,28,33,.7),rgba(20,21,25,.5));
    border:1px solid var(--line);border-radius:20px;padding:34px 26px;position:relative;overflow:hidden}
  .install::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(60% 80% at 50% -10%,rgba(45,212,191,.12),transparent 60%)}
  .hint-bar{font-size:12px;color:var(--mut);margin-bottom:22px}
  .hint-bar b{color:var(--txt)}
  .hint-bar kbd{font-family:ui-monospace,monospace;background:var(--bg2);border:1px solid var(--line);
    border-radius:5px;padding:1px 7px;font-size:11px;color:var(--teal)}

  .bm-btn{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:grab;user-select:none;
    font-family:'Space Grotesk',system-ui,sans-serif;font-weight:800;font-size:20px;letter-spacing:.3px;color:#06120f;
    background:linear-gradient(135deg,#2dd4bf,#3b8cff);border:none;border-radius:16px;padding:18px 38px;text-decoration:none;
    box-shadow:0 10px 34px rgba(45,212,191,.32),0 0 0 1px rgba(255,255,255,.12) inset;transition:transform .15s,box-shadow .2s}
  .bm-btn:hover{transform:translateY(-3px);box-shadow:0 16px 44px rgba(45,212,191,.45)}
  .bm-btn:active{cursor:grabbing;transform:translateY(-1px)}
  .bm-btn.loading{filter:grayscale(.4) brightness(.8);cursor:wait}
  .bm-btn::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
    box-shadow:0 0 0 0 rgba(45,212,191,.5);animation:ring 2.2s infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(45,212,191,.45)}70%{box-shadow:0 0 0 16px rgba(45,212,191,0)}100%{box-shadow:0 0 0 0 rgba(45,212,191,0)}}
  .drag-hint{margin-top:16px;font-size:13px;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:8px}
  .drag-hint .arrow{font-size:18px;color:var(--teal);animation:bob 1.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .lang-note{margin-top:10px;font-size:11px;color:var(--mut)}
  .lang-note b{color:var(--teal)}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px;align-items:center}
  .copy-btn{font-family:inherit;font-weight:700;font-size:13px;color:var(--txt);cursor:pointer;
    background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 20px;transition:.15s}
  .copy-btn:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-1px)}
  .copy-btn.ok{background:var(--green);color:#06120f;border-color:var(--green)}
  .rebuild-btn{font-family:inherit;font-weight:700;font-size:13px;color:var(--txt);cursor:pointer;
    background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 20px;transition:.15s}
  .rebuild-btn:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-1px)}
  .rebuild-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  #build-status{font-family:ui-monospace,monospace;font-size:12px;color:var(--mut);min-height:18px;line-height:18px}
  #build-status.ready{color:var(--green)}
  #build-status.error{color:var(--red)}
  #build-status.loading{color:var(--amber)}
  #build-version{font-family:ui-monospace,monospace;font-size:11px;color:var(--mut);opacity:.7}
  .warn{display:none;margin-top:18px;font-size:12px;color:var(--amber);background:rgba(245,177,61,.08);
    border:1px solid rgba(245,177,61,.3);border-radius:10px;padding:10px 14px;line-height:1.6;text-align:left}
  .warn a{color:var(--teal);font-weight:700}
  .warn code{font-family:ui-monospace,monospace;background:rgba(0,0,0,.3);padding:1px 5px;border-radius:4px}

  section.block{padding:60px 0 10px}
  .sec-title{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:800;font-size:clamp(24px,4vw,34px);
    text-align:center;letter-spacing:.3px}
  .sec-sub{text-align:center;color:var(--mut);margin-top:8px;font-size:14px}

  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:34px}
  .step{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:22px;position:relative;transition:.2s}
  .step:hover{border-color:rgba(45,212,191,.4);transform:translateY(-3px)}
  .step .n{position:absolute;top:-14px;left:18px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    font-weight:800;font-size:14px;color:#06120f;background:linear-gradient(135deg,#2dd4bf,#3b8cff)}
  .step h3{font-size:15px;margin:6px 0 8px}
  .step p{font-size:13px;color:var(--mut)}
  .step kbd{font-family:ui-monospace,monospace;background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--teal)}

  .feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:34px}
  .feat{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:22px;transition:.2s}
  .feat:hover{border-color:rgba(45,212,191,.4);transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .feat .ic{font-size:26px;margin-bottom:10px}
  .feat h3{font-size:15px;margin-bottom:6px}
  .feat p{font-size:13px;color:var(--mut)}
  .feat.rules{border-color:rgba(167,139,250,.3)}
  .feat.rules:hover{border-color:rgba(167,139,250,.55);box-shadow:0 10px 30px rgba(167,139,250,.12)}

    border:1px solid rgba(245,177,61,.28);border-radius:12px;padding:12px 16px;line-height:1.6;text-align:center}

  .shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-top:34px}
  .shot{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg1);transition:.2s}
  .shot:hover{border-color:rgba(45,212,191,.4);transform:translateY(-3px);box-shadow:0 14px 40px rgba(0,0,0,.4)}
  .shot a{display:block}
  .shot img{width:100%;display:block}
  .shot .cap{padding:10px 14px;font-size:12px;color:var(--mut)}

  footer{position:relative;z-index:1;border-top:1px solid var(--line);margin-top:70px;padding:28px 0;
    text-align:center;color:var(--mut);font-size:13px}
  footer a{color:var(--teal);text-decoration:none;font-weight:700}
  footer a:hover{text-decoration:underline}
</style>
</head>

<script>
/* ===== частицы на весь фон ===== */
try{(function(){
  var c=document.getElementById('bg-canvas');
  if(!c){return;}
  var x=c.getContext('2d');if(!x)return;
  var w,h,p=[],COLS=['45,212,191','45,212,191','45,212,191','59,140,255','167,139,250'],
      mouse={x:-9999,y:-9999,on:false};
  function rs(){w=c.width=innerWidth;h=c.height=innerHeight;}
  function P(){this.x=Math.random()*w;this.y=Math.random()*h;this.vx=(Math.random()-.5)*.35;this.vy=(Math.random()-.5)*.35;this.s=Math.random()*1.6+.7;this.c=COLS[(Math.random()*COLS.length)|0];}
  P.prototype.u=function(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>w)this.vx*=-1;if(this.y<0||this.y>h)this.vy*=-1;};
  function build(){p=[];var n=Math.min(130,Math.max(40,Math.round(w*h/13000)));for(var i=0;i<n;i++)p.push(new P());}
  function line(ax,ay,bx,by,col,a){x.beginPath();x.strokeStyle='rgba('+col+','+a.toFixed(3)+')';x.lineWidth=.6;x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke();}
  rs();build();
  (function f(){x.clearRect(0,0,w,h);for(var i=0;i<p.length;i++){var a=p[i];a.u();x.shadowColor='rgba('+a.c+',.8)';x.shadowBlur=6;x.beginPath();x.arc(a.x,a.y,a.s,0,6.2832);x.fillStyle='rgba('+a.c+',.65)';x.fill();x.shadowBlur=0;if(mouse.on){var mdx=a.x-mouse.x,mdy=a.y-mouse.y,md=Math.sqrt(mdx*mdx+mdy*mdy);if(md<160)line(a.x,a.y,mouse.x,mouse.y,a.c,.4*(1-md/160));}for(var j=i+1;j<p.length;j++){var b=p[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);if(d<125)line(a.x,a.y,b.x,b.y,'45,212,191',.14*(1-d/125));}}requestAnimationFrame(f);})();
  addEventListener('resize',function(){rs();build();});
  addEventListener('mousemove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;mouse.on=true;});
  addEventListener('mouseout',function(){mouse.on=false;});
})();}catch(e){}

/* ===== язык: дефолт = память || язык браузера (НЕ ip — прокси ломают ip) ===== */
function detectLang(){
  try{var s=localStorage.getItem('pa_site_lang');if(s==='ru'||s==='en')return s;}catch(e){}
  var nl=(navigator.language||navigator.userLanguage||'').toLowerCase();
  return nl.indexOf('ru')===0?'ru':'en';
}
var siteLang=detectLang();

function applyLanguage(lang,animate){
  siteLang=lang;
  try{localStorage.setItem('pa_site_lang',lang);}catch(e){}
  document.documentElement.lang=lang;
  var sw=document.getElementById('langsw');
  if(sw){sw.classList.toggle('en',lang==='en');sw.querySelectorAll('.opt').forEach(function(o){o.classList.toggle('on',o.getAttribute('data-lang')===lang);});}
  var nodes=document.querySelectorAll('[data-i18n],[data-i18n-html]');
  var paint=function(){
    nodes.forEach(function(el){
      var k=el.getAttribute('data-i18n')||el.getAttribute('data-i18n-html');
      var v=(D[lang]&&D[lang][k]!=null)?D[lang][k]:(D.ru[k]!=null?D.ru[k]:'');
      if(el.hasAttribute('data-i18n-html'))el.innerHTML=v;else el.textContent=v;
    });
    if(window.__pa_code_ru){
      var code=(lang==='en')?window.__pa_code_en:window.__pa_code_ru;
      window.__pa_cur_code=code;
      var link=document.getElementById('bm-link');
      if(link&&!link.classList.contains('loading'))link.href=code;
    }
    if(animate)nodes.forEach(function(el){el.classList.remove('i18n-fade');});
  };
  if(animate){nodes.forEach(function(el){el.classList.add('i18n-fade');});setTimeout(paint,180);}
  else paint();
}

document.getElementById('langsw').addEventListener('click',function(){
  applyLanguage(siteLang==='ru'?'en':'ru',true);
});

/* ===== ГИБРИДНАЯ СБОРКА букмарклета из модулей src/ ===== */
var MODULES=['i18n.js','styles.js','accounts.js','modal.js','rules.js','bindings.js'];
var BASE='https://cdn.jsdelivr.net/gh/Kw3nty/ParserAccs@main/src/';

function hashStr(s){var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h)^s.charCodeAt(i);h|=0;}return (h>>>0).toString(16).padStart(8,'0');}

function buildBookmarklet(){
  var link=document.getElementById('bm-link'),
      copy=document.getElementById('bm-copy'),
      warn=document.getElementById('warn'),
      drag=document.querySelector('.drag-hint'),
      status=document.getElementById('build-status'),
      version=document.getElementById('build-version'),
      rebuild=document.getElementById('bm-rebuild');

  link.classList.add('loading');
  link.href='javascript:void(0)';
  link.textContent='⏳ …';
  link.style.filter='';
  if(status){status.className='loading';status.textContent=(siteLang==='en'?'⏳ Building from '+MODULES.length+' modules…':'⏳ Собираю из '+MODULES.length+' модулей…');}
  if(version)version.textContent='';
  if(drag)drag.style.display='flex';
  if(warn)warn.style.display='none';
  if(copy)copy.disabled=true;
  if(rebuild)rebuild.disabled=true;

  var ts=Date.now();
  Promise.all(MODULES.map(function(m){
    return fetch(BASE+m+'?v='+ts).then(function(r){
      if(!r.ok)throw new Error(m+' → HTTP '+r.status);
      return r.text();
    });
  })).then(function(txts){
    var joined=txts.join('\n').replace(/^\uFEFF/,'').trim();
    var src;
    if(joined.indexOf('javascript:')===0) src=joined;
    else src='javascript:'+joined;

    window.__pa_code_ru=src;
    window.__pa_code_en=src.replace(/^javascript:/,'javascript:var PA_LANG="en";');
    window.__pa_cur_code=(siteLang==='en')?window.__pa_code_en:window.__pa_code_ru;

    link.href=window.__pa_cur_code;
    link.classList.remove('loading');
    link.textContent='📌 ParserAccs';
    link.title=(siteLang==='en'?'Drag me to your bookmarks bar':'Перетащи меня на панель закладок');
    link.style.filter='';

    var hv=hashStr(src).slice(0,6);
    var kb=Math.round(src.length/1024);
    if(status){status.className='ready';status.textContent=(siteLang==='en'?'✓ Ready':'✓ Готово');}
    if(version)version.textContent='build · '+hv+' · '+kb+'KB';
    if(copy)copy.disabled=false;
    if(rebuild)rebuild.disabled=false;

    applyLanguage(siteLang,false);
  }).catch(function(e){
    link.classList.remove('loading');
    link.textContent='📌 ParserAccs';
    link.style.filter='grayscale(.5) brightness(.85)';
    if(drag)drag.style.display='none';
    if(status){status.className='error';status.textContent=(siteLang==='en'?'✗ Error: '+e.message:'✗ Ошибка: '+e.message);}
    if(version)version.textContent=(siteLang==='en'?'try "🔁 Rebuild" in 1–2 min':'нажми «🔁 Пересобрать» через 1–2 мин');
    if(warn){warn.style.display='block';var m=warn.querySelector('.pa-wmsg');if(m)m.textContent=(siteLang==='en'?'Bookmarklet code failed to load.':'Код букмарклета не подгрузился.');}
    if(copy)copy.disabled=true;
    if(rebuild)rebuild.disabled=false;
  });
}

/* ===== инициализация ===== */
try{(function(){
  var link=document.getElementById('bm-link'),
      copy=document.getElementById('bm-copy'),
      rebuild=document.getElementById('bm-rebuild');

  link.addEventListener('click',function(e){e.preventDefault();});

  if(rebuild){
    rebuild.textContent=(siteLang==='en'?'🔁 Rebuild':'🔁 Пересобрать');
    rebuild.addEventListener('click',function(){buildBookmarklet();});
  }

  if(copy){
    copy.addEventListener('click',function(){
      var code=window.__pa_cur_code;
      if(!code){document.getElementById('warn').style.display='block';return;}
      var btn=this,done=function(){btn.classList.add('ok');var o=btn.textContent;btn.textContent=(siteLang==='en'?'✓ Copied':'✓ Скопировано');setTimeout(function(){btn.classList.remove('ok');btn.textContent=D[siteLang].copybtn;},1600);};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done).catch(fallback);}
      else fallback();
      function fallback(){var ta=document.createElement('textarea');ta.value=code;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();}
    });
  }

  /* АВТО-сборка при загрузке */
  buildBookmarklet();
})();}catch(e){}

applyLanguage(siteLang,false);
</script>
